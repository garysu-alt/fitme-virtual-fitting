<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitMe - 3D 虛擬更衣間</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        /* 自訂滑桿樣式 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 3px;
        }
        #canvas-container {
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        /* 隱藏捲軸但保持滾動功能 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <nav class="w-full bg-white shadow-sm z-20 relative flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">F</div>
                <span class="font-bold text-xl tracking-tight">FitMe <span class="text-sm font-normal text-slate-500 ml-1">AI 虛擬試穿</span></span>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- 單位切換器 -->
                <div class="flex bg-slate-100 p-1 rounded-lg text-xs font-medium">
                    <button id="unit-cm" class="px-3 py-1.5 rounded-md bg-white text-blue-600 shadow-sm transition-all" onclick="setUnit('cm')">公分 (cm)</button>
                    <button id="unit-inch" class="px-3 py-1.5 rounded-md text-slate-500 hover:text-slate-700 transition-all" onclick="setUnit('inch')">英吋 (in)</button>
                </div>
                <div class="text-sm font-medium text-slate-500 hidden sm:block">
                    拖曳中間模型旋轉視角
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 h-full min-h-0 overflow-y-auto lg:overflow-hidden">
        
        <!-- 左側：身型控制面板 -->
        <section class="lg:col-span-3 glass-panel rounded-2xl p-6 flex flex-col gap-6 overflow-y-auto h-full hide-scrollbar">
            <div>
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    身型設定
                </h2>
                
                <div class="flex gap-2 mb-6">
                    <button id="btn-male" class="flex-1 py-2 rounded-lg font-medium transition-all bg-slate-100 text-slate-500 hover:bg-slate-200" onclick="setGender('male')">男性</button>
                    <button id="btn-female" class="flex-1 py-2 rounded-lg font-medium transition-all bg-blue-500 text-white shadow-md" onclick="setGender('female')">女性</button>
                </div>

                <div class="space-y-5">
                    <!-- Height -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm font-medium text-slate-700">身高 (Height)</label>
                            <span id="val-height" class="text-sm font-bold text-blue-600">165 cm</span>
                        </div>
                        <input type="range" id="slider-height" min="140" max="200" value="165" oninput="updateParam('height', this.value)">
                    </div>
                    <!-- Weight -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm font-medium text-slate-700">體重 (Weight)</label>
                            <span id="val-weight" class="text-sm font-bold text-blue-600">55 kg</span>
                        </div>
                        <input type="range" id="slider-weight" min="40" max="120" value="55" oninput="updateParam('weight', this.value)">
                    </div>
                    <!-- Shoulders -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm font-medium text-slate-700">肩寬 (Shoulders)</label>
                            <span id="val-shoulders" class="text-sm font-bold text-blue-600">38 cm</span>
                        </div>
                        <input type="range" id="slider-shoulders" min="30" max="60" value="38" oninput="updateParam('shoulders', this.value)">
                    </div>
                    <!-- Chest (女性專屬) -->
                    <div id="container-chest" class="transition-all duration-300">
                        <div class="flex justify-between mb-1">
                            <label class="text-sm font-medium text-slate-700">胸圍 (Chest)</label>
                            <span id="val-chest" class="text-sm font-bold text-blue-600">85 cm</span>
                        </div>
                        <input type="range" id="slider-chest" min="70" max="115" value="85" oninput="updateParam('chest', this.value)">
                    </div>
                    <!-- Waist -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm font-medium text-slate-700">腰圍 (Waist)</label>
                            <span id="val-waist" class="text-sm font-bold text-blue-600">65 cm</span>
                        </div>
                        <input type="range" id="slider-waist" min="50" max="120" value="65" oninput="updateParam('waist', this.value)">
                    </div>
                    <!-- Hips -->
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-sm font-medium text-slate-700">臀圍 (Hips)</label>
                            <span id="val-hip" class="text-sm font-bold text-blue-600">90 cm</span>
                        </div>
                        <input type="range" id="slider-hip" min="70" max="130" value="90" oninput="updateParam('hip', this.value)">
                    </div>
                </div>
            </div>
            <div class="mt-auto pt-4 border-t border-slate-200">
                <p class="text-xs text-slate-500">支援公分與英吋即時轉換，滑桿數值與 3D 模型連動。</p>
            </div>
        </section>

        <section class="lg:col-span-6 relative rounded-2xl overflow-hidden bg-gradient-to-b from-slate-200 to-slate-100 shadow-inner flex items-center justify-center min-h-[400px]">
            <div id="canvas-container" class="w-full h-full absolute inset-0"></div>
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-white/70 backdrop-blur px-4 py-2 rounded-full text-xs font-medium text-slate-600 shadow-sm pointer-events-none">
                左右滑動旋轉視角
            </div>
        </section>

        <section class="lg:col-span-3 glass-panel rounded-2xl p-6 flex flex-col h-full overflow-y-auto">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                智慧服飾抓取
            </h2>

            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-2">貼上商品網址</label>
                <div class="flex gap-2">
                    <input type="text" id="url-input" placeholder="https://..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" value="https://shop.example.com/item/tshirt-01">
                </div>
                <button onclick="fetchClothing()" class="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition-colors shadow-md flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    解析網址並試穿
                </button>
            </div>

            <!-- 載入中動畫 -->
            <div id="loading-state" class="hidden flex-col items-center justify-center py-6">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-2"></div>
                <p class="text-sm text-slate-500">正在分析商品尺寸...</p>
            </div>

            <!-- 分析結果 -->
            <div id="result-state" class="hidden flex-col gap-4">
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-800 mb-2">服飾解析結果</h3>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div class="text-slate-500">商品肩寬:</div><div id="cloth-shoulder" class="font-medium text-right">--</div>
                        <div class="text-slate-500">商品胸圍:</div><div id="cloth-chest" class="font-medium text-right">--</div>
                        <div class="text-slate-500">商品衣長:</div><div id="cloth-length" class="font-medium text-right">--</div>
                        <div class="text-slate-500">商品顏色:</div>
                        <div class="flex justify-end items-center">
                            <div id="cloth-color" class="w-4 h-4 rounded-full border border-slate-300"></div>
                        </div>
                    </div>
                </div>

                <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                    <h3 class="text-sm font-bold text-indigo-800 mb-2">AI 試穿分析</h3>
                    <div class="relative w-full h-2 bg-slate-200 rounded-full mb-4 mt-2">
                        <div id="fit-indicator" class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-white border-2 border-indigo-600 rounded-full shadow-sm transition-all duration-500" style="left: 50%;"></div>
                        <div class="absolute -bottom-5 w-full flex justify-between text-[10px] font-medium text-slate-400">
                            <span>太緊</span>
                            <span>合身</span>
                            <span>寬鬆</span>
                        </div>
                    </div>
                    <p id="fit-message" class="text-sm text-indigo-700 mt-5 font-medium leading-relaxed"></p>
                </div>
                
                <button onclick="removeClothing()" class="mt-auto w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-2 rounded-lg transition-colors text-sm">
                    脫下服飾
                </button>
            </div>

            <!-- 初始提示 -->
            <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-center opacity-50">
                <svg class="w-12 h-12 mb-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <p class="text-sm">輸入網址體驗虛擬試穿</p>
            </div>

        </section>
    </main>

    <script>
        // --- 狀態變數 ---
        let currentUnit = 'cm'; // 'cm' 或 'inch'
        let bodyParams = {
            gender: 'female',
            height: 165,  // 以 cm 儲存基準
            weight: 55,   // kg
            shoulders: 38,// cm
            chest: 85,    // cm
            waist: 65,    // cm
            hip: 90       // cm
        };
        let currentClothing = null; // 儲存 cm 基準

        // 轉換工具函數：cm 轉 inch
        function toDisplay(val, isWeight = false) {
            if (isWeight) return val; // 體重維持 kg
            if (currentUnit === 'inch') {
                return (val / 2.54).toFixed(1);
            }
            return val;
        }

        // 從輸入介面轉回 cm 基準儲存
        function parseInput(val, isWeight = false) {
            let num = parseFloat(val);
            if (isWeight) return num;
            if (currentUnit === 'inch') {
                return Math.round(num * 2.54 * 10) / 10;
            }
            return num;
        }

        // --- 單位切換邏輯 ---
        function setUnit(unit) {
            currentUnit = unit;
            const isCm = (unit === 'cm');
            
            document.getElementById('unit-cm').className = isCm 
                ? "px-3 py-1.5 rounded-md bg-white text-blue-600 shadow-sm transition-all" 
                : "px-3 py-1.5 rounded-md text-slate-500 hover:text-slate-700 transition-all";
            document.getElementById('unit-inch').className = !isCm 
                ? "px-3 py-1.5 rounded-md bg-white text-blue-600 shadow-sm transition-all" 
                : "px-3 py-1.5 rounded-md text-slate-500 hover:text-slate-700 transition-all";

            // 更新滑桿範圍與顯示值
            const hSlider = document.getElementById('slider-height');
            const wSlider = document.getElementById('slider-shoulders');
            const chestSlider = document.getElementById('slider-chest');
            const waistSlider = document.getElementById('slider-waist');
            const hipSlider = document.getElementById('slider-hip');

            if (isCm) {
                hSlider.min = 140; hSlider.max = 200; hSlider.value = bodyParams.height;
                wSlider.min = 30; wSlider.max = 60; wSlider.value = bodyParams.shoulders;
                chestSlider.min = 70; chestSlider.max = 115; chestSlider.value = bodyParams.chest;
                waistSlider.min = 50; waistSlider.max = 120; waistSlider.value = bodyParams.waist;
                hipSlider.min = 70; hipSlider.max = 130; hipSlider.value = bodyParams.hip;
            } else {
                hSlider.min = 55; hSlider.max = 79; hSlider.value = (bodyParams.height / 2.54).toFixed(1);
                wSlider.min = 12; wSlider.max = 24; wSlider.value = (bodyParams.shoulders / 2.54).toFixed(1);
                chestSlider.min = 27; chestSlider.max = 45; chestSlider.value = (bodyParams.chest / 2.54).toFixed(1);
                waistSlider.min = 20; waistSlider.max = 47; waistSlider.value = (bodyParams.waist / 2.54).toFixed(1);
                hipSlider.min = 27; hipSlider.max = 51; hipSlider.value = (bodyParams.hip / 2.54).toFixed(1);
            }

            refreshUIValues();
            if(currentClothing) updateClothingDisplay();
        }

        function refreshUIValues() {
            const unitLabel = currentUnit === 'cm' ? 'cm' : 'in';
            document.getElementById('val-height').innerText = `${toDisplay(bodyParams.height)} ${unitLabel}`;
            document.getElementById('val-weight').innerText = `${bodyParams.weight} kg`;
            document.getElementById('val-shoulders').innerText = `${toDisplay(bodyParams.shoulders)} ${unitLabel}`;
            document.getElementById('val-chest').innerText = `${toDisplay(bodyParams.chest)} ${unitLabel}`;
            document.getElementById('val-waist').innerText = `${toDisplay(bodyParams.waist)} ${unitLabel}`;
            document.getElementById('val-hip').innerText = `${toDisplay(bodyParams.hip)} ${unitLabel}`;
        }

        // --- Three.js 核心初始化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0xe2e8f0, 20, 100);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 5, 50);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xfffff0, 0.8);
        dirLight.position.set(15, 25, 20);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xaabbff, 0.4);
        fillLight.position.set(-15, 0, 15);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffddee, 0.5);
        backLight.position.set(0, 15, -25);
        scene.add(backLight);

        const mainGroup = new THREE.Group();
        const bodyGroup = new THREE.Group();
        const clothGroup = new THREE.Group();
        mainGroup.add(bodyGroup);
        mainGroup.add(clothGroup);
        scene.add(mainGroup);

        const skinMatOptions = { roughness: 0.4, metalness: 0.1, clearcoat: 0.2, clearcoatRoughness: 0.3 };
        const skinFemaleMat = new THREE.MeshPhysicalMaterial({ color: 0xffe3d4, ...skinMatOptions });
        const skinMaleMat = new THREE.MeshPhysicalMaterial({ color: 0xf3c79b, ...skinMatOptions });

        function clearGroup(group) {
            while(group.children.length > 0) {
                const child = group.children[0];
                if(child.isGroup) clearGroup(child);
                group.remove(child);
                if(child.geometry) child.geometry.dispose();
            }
        }

        function render3DModel() {
            clearGroup(bodyGroup);
            clearGroup(clothGroup);

            const skinMat = bodyParams.gender === 'male' ? skinMaleMat : skinFemaleMat;
            const hScale = bodyParams.height / 170; 
            const weightFactor = bodyParams.weight / (bodyParams.gender === 'female' ? 55 : 70); 
            
            const zThickness = 0.65 * Math.pow(weightFactor, 0.6);
            const shoulderR = (bodyParams.shoulders / 5) / 2;
            const waistR = (bodyParams.waist / 26.5) * Math.pow(weightFactor, 0.3);
            const hipR = (bodyParams.hip / 28) * Math.pow(weightFactor, 0.35);
            let chestR = bodyParams.gender === 'female' ? (bodyParams.chest / 27) : (shoulderR * 0.85);

            const torsoLength = 11 * hScale;
            const legLength = 16 * hScale;
            const headY = legLength + torsoLength + (1.5 * hScale) + (2.7 * hScale); 

            const points = [];
            points.push(new THREE.Vector2(0.1, 0));
            points.push(new THREE.Vector2(hipR, torsoLength * 0.22));
            points.push(new THREE.Vector2(waistR, torsoLength * 0.48));
            points.push(new THREE.Vector2(chestR, torsoLength * 0.78));
            points.push(new THREE.Vector2(shoulderR * 0.95, torsoLength * 0.95));
            points.push(new THREE.Vector2(1.2 * hScale, torsoLength));
            
            const spline = new THREE.SplineCurve(points);
            const torsoGeo = new THREE.LatheGeometry(spline.getPoints(32), 48);
            const torso = new THREE.Mesh(torsoGeo, skinMat);
            torso.scale.z = zThickness;
            torso.position.y = legLength;
            bodyGroup.add(torso);

            if (bodyParams.gender === 'female') {
                const breastRadius = Math.max(1.0, (bodyParams.chest - 70) * 0.04);
                const breastGeo = new THREE.SphereGeometry(breastRadius, 32, 32);
                breastGeo.scale(1, 0.85, 0.65);
                
                const breastL = new THREE.Mesh(breastGeo, skinMat);
                breastL.position.set(chestR * 0.42, legLength + torsoLength * 0.73, chestR * zThickness * 0.82);
                breastL.rotation.x = -0.15; breastL.rotation.y = 0.2;
                
                const breastR = new THREE.Mesh(breastGeo, skinMat);
                breastR.position.set(-chestR * 0.42, legLength + torsoLength * 0.73, chestR * zThickness * 0.82);
                breastR.rotation.x = -0.15; breastR.rotation.y = -0.2;
                
                bodyGroup.add(breastL);
                bodyGroup.add(breastR);
            }

            const neckGeo = new THREE.CylinderGeometry(1.2 * hScale, 1.4 * hScale, 2 * hScale, 32);
            const neck = new THREE.Mesh(neckGeo, skinMat);
            neck.position.y = legLength + torsoLength + (1 * hScale);
            bodyGroup.add(neck);
            
            const headGeo = new THREE.SphereGeometry(2.3 * hScale, 48, 48);
            headGeo.scale(1, 1.25, 1.05); 
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = headY;
            bodyGroup.add(head);

            function addLimb(rTop, rBot, len, yPos, xPos, rotZ, parent) {
                const group = new THREE.Group();
                const geo = new THREE.CylinderGeometry(rTop, rBot, len, 32);
                const mesh = new THREE.Mesh(geo, skinMat);
                mesh.position.y = -len / 2;
                group.add(mesh);
                
                const jointGeo = new THREE.SphereGeometry(rTop, 32, 32);
                const joint = new THREE.Mesh(jointGeo, skinMat);
                group.add(joint);
                
                group.position.set(xPos, yPos, 0);
                group.rotation.z = rotZ;
                parent.add(group);
                return group;
            }

            const armLen = 6.5 * hScale;
            const upArmR = shoulderR * 0.35 * weightFactor;
            const lowArmR = shoulderR * 0.25 * weightFactor;
            const wristR = shoulderR * 0.15;
            
            const armL = addLimb(upArmR, lowArmR, armLen, legLength + torsoLength * 0.9, shoulderR + upArmR*0.3, 0.15, bodyGroup);
            const lowArmL = addLimb(lowArmR, wristR, armLen, -armLen, 0, 0.05, armL);
            const handGeo = new THREE.SphereGeometry(wristR * 1.5, 24, 24);
            handGeo.scale(1, 1.3, 0.5);
            const handL = new THREE.Mesh(handGeo, skinMat); handL.position.y = -armLen - wristR; lowArmL.add(handL);

            const armR = addLimb(upArmR, lowArmR, armLen, legLength + torsoLength * 0.9, -(shoulderR + upArmR*0.3), -0.15, bodyGroup);
            const lowArmR_obj = addLimb(lowArmR, wristR, armLen, -armLen, 0, -0.05, armR);
            const handR = new THREE.Mesh(handGeo, skinMat); handR.position.y = -armLen - wristR; lowArmR_obj.add(handR);

            const upLegLen = 8 * hScale;
            const lowLegLen = 8 * hScale;
            const thighR = hipR * 0.42 * weightFactor;
            const calfR = hipR * 0.3 * weightFactor;
            const ankleR = hipR * 0.16;
            const legSpacing = hipR * 0.42;
            
            const legL = addLimb(thighR, calfR, upLegLen, legLength, legSpacing, 0.03, bodyGroup);
            const lowLegL = addLimb(calfR, ankleR, lowLegLen, -upLegLen, 0, 0, legL);
            const footGeo = new THREE.BoxGeometry(ankleR * 2.2, ankleR * 1.5, ankleR * 4);
            const footL = new THREE.Mesh(footGeo, skinMat); footL.position.set(0, -lowLegLen - ankleR*0.5, ankleR); lowLegL.add(footL);

            const legR = addLimb(thighR, calfR, upLegLen, legLength, -legSpacing, -0.03, bodyGroup);
            const lowLegR = addLimb(calfR, ankleR, lowLegLen, -upLegLen, 0, 0, legR);
            const footR = new THREE.Mesh(footGeo, skinMat); footR.position.set(0, -lowLegLen - ankleR*0.5, ankleR); lowLegR.add(footR);

            mainGroup.position.y = -16 * hScale;

            if (currentClothing) {
                const clothMat = new THREE.MeshPhysicalMaterial({ 
                    color: currentClothing.colorHex, 
                    side: THREE.DoubleSide,
                    roughness: 0.9,
                    polygonOffset: true,
                    polygonOffsetFactor: -1, 
                    polygonOffsetUnits: -1
                });

                const clothShoulder3D = (currentClothing.shoulder / 5) / 2;
                const clothChest3D = (currentClothing.chest / 26.5); 
                const clothLen3D = (currentClothing.length / 5);

                const clothPoints = [];
                clothPoints.push(new THREE.Vector2(clothChest3D * 0.95, 0));
                clothPoints.push(new THREE.Vector2(clothChest3D, clothLen3D * 0.5));
                clothPoints.push(new THREE.Vector2(clothShoulder3D, clothLen3D));
                
                const clothSpline = new THREE.SplineCurve(clothPoints);
                const shirtBodyGeo = new THREE.LatheGeometry(clothSpline.getPoints(24), 48);
                const shirtBody = new THREE.Mesh(shirtBodyGeo, clothMat);
                
                shirtBody.scale.z = zThickness * 1.1;
                const shoulderHeightY = legLength + torsoLength * 0.95;
                shirtBody.position.y = shoulderHeightY - clothLen3D; 
                clothGroup.add(shirtBody);

                const sleeveLen = 4 * hScale;
                const sleeveThickness = clothShoulder3D * 0.4; 
                const sleeveGeo = new THREE.CylinderGeometry(sleeveThickness, sleeveThickness*0.85, sleeveLen, 32);
                const sleeveOffset = clothShoulder3D + sleeveThickness * 0.2;
                const sleeveY = shoulderHeightY - (sleeveLen/2);
                
                const sleeveL = new THREE.Mesh(sleeveGeo, clothMat);
                sleeveL.position.set(sleeveOffset, sleeveY, 0);
                sleeveL.rotation.z = 0.2;
                clothGroup.add(sleeveL);

                const sleeveR = new THREE.Mesh(sleeveGeo, clothMat);
                sleeveR.position.set(-sleeveOffset, sleeveY, 0);
                sleeveR.rotation.z = -0.2;
                clothGroup.add(sleeveR);
            }
        }

        render3DModel();

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        });
        container.addEventListener('mousemove', (e) => {
            if(isDragging) {
                const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
                mainGroup.rotation.y += deltaMove.x * 0.01;
                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            }
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        
        container.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, {passive: true});
        container.addEventListener('touchmove', (e) => {
            if(isDragging) {
                const deltaMove = { x: e.touches[0].clientX - previousMousePosition.x, y: e.touches[0].clientY - previousMousePosition.y };
                mainGroup.rotation.y += deltaMove.x * 0.01;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        }, {passive: true});
        window.addEventListener('touchend', () => { isDragging = false; });

        function animate() {
            requestAnimationFrame(animate);
            if(!isDragging) {
                mainGroup.rotation.y += 0.002;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        // --- UI 互動邏輯 ---
        function setGender(gender) {
            bodyParams.gender = gender;
            const isFemale = gender === 'female';
            
            document.getElementById('btn-female').className = isFemale 
                ? "flex-1 py-2 rounded-lg font-medium transition-all bg-blue-500 text-white shadow-md" 
                : "flex-1 py-2 rounded-lg font-medium transition-all bg-slate-100 text-slate-500 hover:bg-slate-200";
            document.getElementById('btn-male').className = !isFemale 
                ? "flex-1 py-2 rounded-lg font-medium transition-all bg-blue-500 text-white shadow-md" 
                : "flex-1 py-2 rounded-lg font-medium transition-all bg-slate-100 text-slate-500 hover:bg-slate-200";

            const chestContainer = document.getElementById('container-chest');
            if (isFemale) {
                chestContainer.style.display = 'block';
                bodyParams.height = 165; bodyParams.weight = 55; bodyParams.shoulders = 38; bodyParams.chest = 85; bodyParams.waist = 65; bodyParams.hip = 90;
            } else {
                chestContainer.style.display = 'none';
                bodyParams.height = 178; bodyParams.weight = 70; bodyParams.shoulders = 46; bodyParams.chest = 95; bodyParams.waist = 80; bodyParams.hip = 95;
            }
            setUnit(currentUnit); // 重設滑桿
            render3DModel();
        }

        function updateParam(key, value) {
            bodyParams[key] = parseInput(value, key === 'weight');
            refreshUIValues();
            render3DModel();
            if(currentClothing) analyzeFit();
        }

        function fetchClothing() {
            const url = document.getElementById('url-input').value;
            if(!url) return;

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('result-state').classList.add('hidden');
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('loading-state').classList.add('flex');

            setTimeout(() => {
                let hash = 0;
                for (let i = 0; i < url.length; i++) hash = url.charCodeAt(i) + ((hash << 5) - hash);
                
                const colors = ['#1e293b', '#ef4444', '#10b981', '#3b82f6', '#f59e0b', '#ec4899', '#ffffff'];
                const cIndex = Math.abs(hash) % colors.length;
                
                currentClothing = {
                    shoulder: 36 + (Math.abs(hash) % 15),
                    chest: 80 + (Math.abs(hash) % 40),
                    length: 55 + (Math.abs(hash) % 20),
                    colorHex: colors[cIndex]
                };

                updateClothingDisplay();

                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('loading-state').classList.remove('flex');
                document.getElementById('result-state').classList.remove('hidden');
                document.getElementById('result-state').classList.add('flex');

                render3DModel();
                analyzeFit();
            }, 1200);
        }

        function updateClothingDisplay() {
            if(!currentClothing) return;
            const unitLabel = currentUnit === 'cm' ? 'cm' : 'in';
            document.getElementById('cloth-shoulder').innerText = `${toDisplay(currentClothing.shoulder)} ${unitLabel}`;
            document.getElementById('cloth-chest').innerText = `${toDisplay(currentClothing.chest)} ${unitLabel}`;
            document.getElementById('cloth-length').innerText = `${toDisplay(currentClothing.length)} ${unitLabel}`;
            document.getElementById('cloth-color').style.backgroundColor = currentClothing.colorHex;
        }

        function removeClothing() {
            currentClothing = null;
            document.getElementById('result-state').classList.add('hidden');
            document.getElementById('result-state').classList.remove('flex');
            document.getElementById('empty-state').classList.remove('hidden');
            render3DModel();
        }

        function analyzeFit() {
            if(!currentClothing) return;

            const shoulderDiff = currentClothing.shoulder - bodyParams.shoulders;
            const activeChest = bodyParams.gender === 'female' ? bodyParams.chest : (bodyParams.waist + 15);
            const chestDiff = currentClothing.chest - activeChest;

            let score = 50; 
            score += (shoulderDiff * 3); 
            score += (chestDiff * 1.5);
            score = Math.max(5, Math.min(95, score));
            
            document.getElementById('fit-indicator').style.left = `${score}%`;
            
            const msgEl = document.getElementById('fit-message');
            if (score < 30) {
                msgEl.innerText = "這件衣服對您來說可能太緊了。肩膀或胸口可能會產生明顯的緊繃感，建議選擇大一號的尺寸！";
                msgEl.className = "text-sm text-red-600 mt-5 font-medium leading-relaxed";
                document.getElementById('fit-indicator').style.borderColor = "#dc2626";
            } else if (score > 70) {
                msgEl.innerText = "這件衣服穿起來會呈現 Oversize 的寬鬆感，如果您喜歡慵懶舒適風格，這會是個不錯的選擇。";
                msgEl.className = "text-sm text-blue-600 mt-5 font-medium leading-relaxed";
                document.getElementById('fit-indicator').style.borderColor = "#2563eb";
            } else {
                msgEl.innerText = "完美的合身比例！這件衣服的肩線與胸圍非常貼合您的身型。";
                msgEl.className = "text-sm text-green-600 mt-5 font-medium leading-relaxed";
                document.getElementById('fit-indicator').style.borderColor = "#16a34a";
            }
        }
    </script>
</body>
</html>
